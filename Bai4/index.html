<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <style>
        h2{
            color:pink;
            background-color:black;
        }
        h3{
            color:white;
            background-color:black;
        }
        h4{
            color:yellow;
            background-color:green;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Cách 1: Inline style-->
    <!--color: Quy định màu chữ-->
    <!--background-color: Quy định màu viền-->
    <h1 style="color: blue; background-color: orange">Bài Style</h1>
    <!--Cách 2: Internal Style-->
    <h2>Cách 2 Internal Style</h2>
    <h3>Phạm Thị Thu Thuỷ</h3>
    <!--Cách 3: External style-->
    <h4>Cách 3: external style</h4>
</body>
</html>

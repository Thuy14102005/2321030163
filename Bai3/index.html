<html>
    <head>
        <title>Bai 3</title>
    </head>
    <body>
        <MARQUEE>
            <img src="../Anh/IMG_7334.JPG">
        </MARQUEE>
        <!--Danh sách có thứ tự-->
        <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ol>
        <!--Danh sách không có thứ tự-->
        <ul>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul>
        <h1>Form đăng ký</h1>
        <form>
            <div>
                <b>Họ và tên</b><br>
                <!--Nếu input không có "type" thì sẽ mặc định là text-->
                <!--Thuộc tính "readonly" sử dụng khi không muốn người dùng nhập thông tin vào input-->
                <input type='text' placeholder='Họ và tên' readonly>
            </div>
            <div>
                <!--number: chỉ cho phép ngườu dùng nhập số-->
                <b>Năm sinh</b><br>
                <input type="number" placeholder="Năm sinh">
            </div>
            <div>
                <b>Mật khẩu</b><br>
                <input type='password' placeholder='Mật khẩu'>
            </div>
            <div>
                <!--<textarea>: nhập thông tin không giới hạn-->
                <b>Giới thiệu về bản thân</b><br>
                <textarea>Nhập thông tin ...</textarea>
            </div>
            <div>
                <b>Email</b><br>
                <input type='email'>
            </div>
            <div>
                <!--Số đầu tiên: 0
                Số thứ 2: 3,9,9
                8 số cuối: 0-9-->
                <b>Số điện thoại</b><br>
                <input type='tel' pattern='([0]{1}([3,8,9]{1}[0-9]{8}))'>
            </div>
            <div>
                <!--"Gender": chọn cả nam, nữ-->
                <b>Giới tính</b><br>      
                <input type='radio' name='giới tính' value='nam'>Nam<br>
                <input type='radio' name='giới tính' value='nu'>Nữ<br>
            </div>
            <div>
                <!--Checkbox:chọn nhiều đối tượng-->
                <b>Sở thích</b><br>
                Game: <input type="checkbox" name="sở thích" value="chơi game"><br>
                Nghe nhạc: <input type="checkbox" name="sở thích" value="nghe nhạc"><br>
                Xem phim: <input type="checkbox" name="sở thích" value="xem phim"><br>
            </div>
            <div>
                <!--select: nhiều lựa chọn-->
                <b>Trình duyệt web ưa thích</b><br>
                <select name="browsers">
                    <option value="Internet Explorer">Internet Explorer</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Chrome">Chrome</option>
                    <option value="Opera">Opera</option>
                    <option value="Safari">Safari</option>
                    <option value="Cốc cốc">Cốc cốc</option>
                </select>
            </div>
            <div>
                <!--0 <input type="range" id=a="a" value="50"> 100-->
                0 <input type="range" id="a" value="50"> 100
            </div>
            <div>
                <input type='submit'>
                <button>Xác nhận</button>
                <input type="reset">
            </div>
        </form>
        <div>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/Q1MaYD4bpYw?si=XAw1WUPxer9CwifN" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div>
            <video controls with="560" height="315">
                <source src="../Anh/video.mp4" type="video/mp4">
            </video>
        </div>
        <div>
            <audio controls>
                <source src="../Anh/vd1.mp3" type="audio/mp3"></source>
            </audio>
        </div>
    </body>
</html>
